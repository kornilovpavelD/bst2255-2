{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Создание записи</title>
    <link rel="stylesheet" href="{% static 'css/archive.css' %}">
</head>
<body>
    <div class="header">
        <a href="{% url 'archive' %}"><img src="{% static 'img/dpb-logo.png' %}" /></a>
    </div>
    <div class="create-page">
        <a href="{% url 'archive' %}" class="back-link">&larr; Вернуться назад</a>
        <div class="create-card">
            <h2 class="create-title">Создание записи</h2>
            <p style="color: #888; font-size: 14px; margin: -20px 0 25px;">Заполните поля ниже, чтобы добавить новую запись в блог</p>
            <form method="POST" class="create-form">{% csrf_token %}
                <div class="form-group">
                    <label for="id_title">Тема</label>
                    <input type="text" id="id_title" name="title" placeholder="Тема статьи" value="{{ form.title }}">
                </div>
                <div class="form-group">
                    <label for="id_text">Содержание</label>
                    <textarea id="id_text" name="text" placeholder="Содержание статьи...">{{ form.text }}</textarea>
                </div>
                {% if form.errors %}
                <div class="field-errors">{{ form.errors }}</div>
                {% endif %}
                <div class="form-actions">
                    <a href="{% url 'archive' %}" class="btn-cancel">Назад</a>
                    <input type="submit" value="Добавить" class="btn-submit">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
